<!DOCTYPE html>

<html lang = "en">
   <head>
      <title>Garden Guardian</title>
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="style.css">
      <script src="script.js" defer></script>
   </head>

   <body>
      <header>
         <h1>Garden Guardian</h1>
         <h2>We make it easy.</h2>
      </header>

      <nav>
         <li><a href="index.html">Home</a></li>
         <li><a href="mulching.html">Mulching</a></li>
         <li><a href="mowing.html">Mowing</a></li>
         <li><a href="sodding.html">Sodding</a></li>

         <li><a href="signup.html">Sign Up</a></li>
      </nav>

      <main>
         <h3>Sign Up</h3>

         <form class="signupForm" id="signupForm">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="hearAboutUs">How did you hear about us?</label>
            <select id="hearAboutUs" name="hearAboutUs" required>
               <option value="referral">Referral</option>
               <option value="socialmedia">Social Media</option>
               <option value="billboard">Billboard</option>
               <option value="van-truck">Van/Truck</option>
            </select>

            <button type="submit" id="signupButton">Sign Up</button>

            <p id="signupMessage"></p>
         </form>
      </main>

      <footer>
         <p>Garden Guardian™</p>
         <p>123 Green Lawn Lane, Greensville, NJ, 01234</p>
         <p>Phone: (123) 456-7890</p>
         <p>Email: yourguardian@gardenguardian.com</p>
      </footer>
   </body>
</html>
